[project]
name = "crinis-labeling-pipeline"
version = "0.1.0"
description = "CVAT automation, label protocol, agreement measurement and release gate for video hand labeling"
requires-python = ">=3.11"
dependencies = ["numpy", "pyarrow", "av", "opencv-python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
